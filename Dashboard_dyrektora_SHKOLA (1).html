<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>SHKOLA · Дашборд директора</title><style>:root {
  color-scheme: light;
  --navy: #07182f;
  --blue: #0757e8;
  --paper: #f6f7f5;
  --ink: #273140;
  --muted: #647185;
  --line: #dfe5ec;
  --white: #fff;
  --pale: #edf3ff;
  --radius: 14px;
  --font: "Segoe UI Variable Display", "Segoe UI", Arial, sans-serif;
}

* { box-sizing: border-box; }
html { min-width: 320px; background: var(--paper); }
body { margin: 0; color: var(--ink); background: var(--paper); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; color: inherit; }
button:disabled { cursor: default; opacity: .42; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #0757e855; outline-offset: 3px; }
a { color: var(--blue); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { color: var(--navy); font-weight: 600; letter-spacing: -.025em; }
h1 { font-size: 27px; line-height: 1.18; }
h2 { font-size: 18px; line-height: 1.3; }
h3 { font-size: 15px; line-height: 1.35; }
svg { vertical-align: middle; flex-shrink: 0; }
button svg { width: 18px; height: 18px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; line-height: 1.4; }
.note { font-size: 12px; color: var(--muted); line-height: 1.5; }
.divider { height: 1px; background: var(--line); border: 0; margin: 17px 0; }

.app-shell { min-height: 100dvh; display: grid; grid-template-columns: 190px minmax(0, 1fr); }
.sidebar { position: sticky; top: 0; height: 100dvh; min-width: 0; display: flex; flex-direction: column; padding: 24px 14px 18px; background: var(--white); border-right: 1px solid var(--line); }
.brand { display: block; width: 160px; max-width: 100%; height: auto; margin: 0 auto; }
.school-label { margin: 25px 10px 23px; color: var(--navy); font-size: 14px; font-weight: 600; line-height: 1.45; }
.school-label small, .school-label span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 400; }
.sidebar nav, .sidebar .nav-list { display: flex; flex-direction: column; gap: 5px; }
.nav-item { width: 100%; min-height: 42px; display: flex; align-items: center; gap: 11px; padding: 10px 12px; border: 0; border-radius: 9px; color: #536075; background: transparent; text-align: left; text-decoration: none; font-weight: 500; }
.nav-item svg { width: 18px; height: 18px; opacity: .85; }
.nav-item:hover { background: #f1f4f8; color: var(--navy); }
.nav-item.active, .nav-item[aria-current="page"] { background: var(--pale); color: var(--blue); }
.nav-item .count-badge { margin-left: auto; }
.sidebar-focus { margin: 25px 0; }
.sidebar-focus > p { padding: 0 12px; margin-bottom: 6px; }
.sidebar-focus .nav-item { font-size: 12px; }
.sidebar-foot { margin-top: auto; padding: 19px 10px 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
.sidebar-foot p + p { margin-top: 7px; }
.sidebar-foot .notice { display: block; padding: 8px; font-size: 11px; line-height: 1.4; }
.sidebar-foot .bread-button { display: block; margin-top: 10px; text-align: left; line-height: 1.5; }
.main { min-width: 0; }
.topbar { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: #ffffffd9; }
.topbar > * { min-width: 0; }
.page { width: 100%; max-width: 1680px; padding: 24px; margin: 0 auto; min-width: 0; }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 20px; }
.page-head > * { min-width: 0; }
.page-head p, .page-head .sub { color: var(--muted); margin-top: 6px; font-size: 13px; }
.page-head h1 + .inline-actions { margin-top: 12px; }
.page-head > div > .inline-actions { margin-bottom: 10px; }
.page-head > .tabs { margin-bottom: 0; }
.inline-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.count-badge { min-width: 22px; display: inline-flex; justify-content: center; align-items: center; border-radius: 6px; padding: 2px 6px; color: var(--muted); background: #edf1f6; font-size: 11px; font-weight: 600; line-height: 1.4; font-variant-numeric: tabular-nums; }
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.bread-button { padding: 4px 0; border: 0; background: transparent; color: var(--blue); text-decoration: none; font-size: inherit; }
.bread-button:hover { text-decoration: underline; }

.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.metric { position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; min-width: 0; min-height: 104px; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); color: inherit; text-align: left; }
button.metric:hover { border-color: #afc0d8; box-shadow: 0 2px 8px #07182f05; }
.metric.selected { border-color: var(--blue); background: #f8faff; box-shadow: inset 0 3px 0 var(--blue); }
.metric-value { color: var(--navy); font-size: 30px; font-weight: 600; line-height: 1.12; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.metric.selected .metric-value { color: var(--blue); }
.metric-value small, .metric-value span { font-size: 15px; font-weight: 400; color: var(--muted); letter-spacing: -.01em; }
.metric-label { color: #536175; font-size: 12px; font-weight: 500; line-height: 1.35; margin-bottom: 7px; }
.metric-sub { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.35; }

.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 18px; align-items: start; min-width: 0; }
.panel { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 53px; padding: 14px 17px; border-bottom: 1px solid var(--line); }
.panel-head h2, .panel-head h3 { font-size: 15px; }
.panel-head .small { color: var(--muted); }
.panel > .note, .panel > .notice { margin: 15px 17px; }
.panel > .mini-bars, .panel > .timeline, .panel > .callout, .panel > .detail-stats { margin: 17px; }
.panel > .tabs { margin-left: 17px; margin-right: 17px; }
.panel > .empty { border: 0; }
.panel > h2, .panel > h3 { padding: 16px 17px 0; }
.panel > p { margin: 14px 17px; }
.panel > .button, .panel > .bread-button { margin: 0 17px 17px; }
.panel > .tag { margin: 0 17px 14px; }
.panel > .task-line { margin-inline: 17px; }
.panel > .timeline > .task-line:first-child { padding-top: 0; }
.filters { display: flex; align-items: center; justify-content: flex-start; flex-wrap: wrap; gap: 8px; padding: 11px 17px; border-bottom: 1px solid var(--line); }
.filters > .search-input { flex: 1 1 150px; min-width: 120px; max-width: 280px; }
.page > .filters { margin-bottom: 18px; border: 1px solid var(--line); border-radius: 11px; background: white; }
.filters .field { margin-bottom: 0; gap: 4px; }
.filters .field:first-child { flex: 1 1 180px; max-width: 300px; }
.filters .field .search-input { width: 100%; }
.filters select { max-width: 180px; }
.table-wrap { width: 100%; max-width: 100%; min-width: 0; overflow-x: auto; overscroll-behavior-inline: contain; }
.data-table { border-collapse: collapse; width: 100%; min-width: 670px; font-size: 14px; line-height: 1.4; }
.data-table th { padding: 10px 12px; background: #fafbfc; border-bottom: 1px solid var(--line); text-align: left; color: var(--muted); font-size: 11px; font-weight: 500; line-height: 1.35; }
.data-table td { height: 58px; padding: 10px 12px; border-bottom: 1px solid #ebeff4; vertical-align: middle; }
.data-table .table-title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; line-height: 1.3; max-height: 2.6em; }
.data-table tbody td { padding-top: 7px; padding-bottom: 7px; }
.data-table tbody tr:last-child td { border-bottom: 0; }
.data-table tbody tr:hover { background: #f8faff; }
.data-table tr[tabindex], .data-table tr[data-class], .data-table tr.clickable { cursor: pointer; }
.data-table td:first-child, .data-table th:first-child { padding-left: 17px; }
.data-table th:first-child { width: 34%; }
.data-table td:first-child { min-width: 230px; }
.data-table td:last-child, .data-table th:last-child { padding-right: 17px; }
.data-table .button, .data-table .icon-button { min-height: 34px; }
.table-title { display: block; color: var(--navy); font-size: 14px; font-weight: 500; line-height: 1.4; white-space: normal; text-align: left; }
.cell-sub { display: block; color: var(--muted); margin-top: 3px; font-size: 11px; line-height: 1.35; }
.result-cell { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--navy); font-variant-numeric: tabular-nums; white-space: normal; }
.result-cell > div { min-width: 0; }
.result-cell > .class-chip { flex-shrink: 0; }
.result-cell strong { font-size: 14px; font-weight: 600; }
.result-cell .progress-track { margin-top: 5px; width: 68px; height: 4px; }
.class-chip { display: inline-flex; align-items: center; justify-content: center; min-width: 45px; padding: 6px 8px; border: 0; border-radius: 8px; background: var(--pale); color: var(--blue); font-size: 13px; font-weight: 600; white-space: nowrap; text-decoration: none; }
.date { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.overdue { color: var(--navy); font-weight: 600; }
.overdue::before { content: ""; display: inline-block; width: 5px; height: 5px; margin-right: 5px; border-radius: 50%; background: currentColor; vertical-align: 2px; }
.owner { color: var(--muted); font-size: 12px; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 17px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.pager .inline-actions { gap: 5px; }
.pager .icon-button, .pager .button { min-width: 34px; min-height: 34px; }

.tag { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 4px 7px; border: 1px solid transparent; border-radius: 6px; font-size: 11px; font-weight: 500; line-height: 1.3; white-space: nowrap; }
.tag.review { color: var(--navy); background: #e8edf4; }
.tag.support { color: var(--blue); background: var(--pale); }
.tag.recheck { color: var(--blue); background: white; border-color: #b9d0fa; }
.tag.normal { color: #4c5a6d; background: #f0f3f6; }
.tag.no_data { color: #788596; background: #f4f5f7; border: 1px dashed #cbd3dd; }
.action-list { display: flex; flex-direction: column; padding: 0 15px; }
.action-item { display: block; min-width: 0; width: 100%; padding: 15px 0; text-align: left; background: none; border: 0; border-bottom: 1px solid #ebeff4; color: inherit; text-decoration: none; }
.action-item:last-child { border-bottom: 0; }
.action-item:hover h3, button.action-item:hover .table-title { color: var(--blue); }
.action-item h3 { margin-bottom: 6px; font-size: 14px; }
.action-item p { font-size: 12px; color: var(--muted); line-height: 1.5; }
.action-item .tag { margin-bottom: 9px; }
.action-item .date { display: block; margin-top: 9px; }
.action-item > .inline-actions { margin-bottom: 10px; }
.action-item > .bread-button { margin-top: 8px; font-size: 12px; }
.decision-line { display: flex; align-items: flex-start; justify-content: space-between; gap: 22px; padding: 17px 0; border-bottom: 1px solid #ebeff4; }
.decision-line:last-child { border-bottom: 0; }
.decision-line > div { min-width: 0; }
.decision-line h3 { margin-top: 10px; }
.decision-line .note { margin-top: 6px; }
.decision-line-end { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex-shrink: 0; }
.decision-line > .inline-actions { flex: 1; flex-wrap: nowrap; min-width: 0; }
.decision-line > .inline-actions > div { min-width: 0; }
.aside-stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.aside-stack .panel-head { padding: 13px 15px; }
.aside-stack .panel-head h2 { font-size: 14px; }
.aside-stack .notice, .aside-stack .note { font-size: 12px; }

.class-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.class-section { margin: 20px 0; }
.class-section > h2 { font-size: 18px; }
.class-card { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 110px; padding: 14px; background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); text-align: left; color: inherit; text-decoration: none; }
button.class-card:hover, a.class-card:hover, .class-card.clickable:hover { border-color: #a6bfe6; box-shadow: 0 3px 12px #07182f06; }
.class-card .class-head { margin: 0; padding: 0; border: 0; }
.class-card .class-head > strong { font-size: 16px; }
.class-card .class-chip { min-width: 49px; }
.class-card h3 { font-size: 14px; }
.class-card .cell-sub { font-size: 12px; }
.class-card .tag { align-self: flex-start; margin-top: auto; }
.class-head { display: flex; justify-content: space-between; align-items: center; gap: 15px; min-width: 0; margin-bottom: 17px; }
.class-head h1, .class-head h2 { margin-bottom: 3px; }
.class-head .class-chip { font-size: 18px; min-width: 61px; padding: 10px; }
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; min-width: 0; }
.detail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; min-width: 0; }
.detail-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat { min-width: 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 11px; background: white; }
.stat strong, .stat .metric-value { display: block; color: var(--navy); font-size: 25px; line-height: 1.2; font-weight: 600; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.stat > .muted, .stat > span, .stat > small { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; }
.stat strong .muted { display: inline; margin-top: 0; font-size: 14px; font-weight: 400; letter-spacing: 0; }
.tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 17px; }
.tabs button { min-height: 39px; padding: 9px 13px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font-size: 13px; }
.tabs button.active, .tabs button[aria-selected="true"], .tabs button[aria-pressed="true"] { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { position: relative; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 11px 0; border-bottom: 1px solid #edf0f4; font-size: 13px; }
.timeline li:last-child { border-bottom: 0; }
.timeline .date { padding-top: 1px; }
.timeline p, .timeline .cell-sub { margin-top: 4px; font-size: 12px; color: var(--muted); }
.timeline .task-line { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 14px; }
.mini-bars { display: grid; gap: 13px; }
.bar-row { display: grid; grid-template-columns: minmax(72px, 100px) minmax(0, 1fr) 52px; gap: 10px; align-items: center; font-size: 12px; }
.bar-row > :last-child { text-align: right; font-variant-numeric: tabular-nums; }
.progress-track { position: relative; min-width: 0; height: 8px; background: #e9eef5; border-radius: 4px; overflow: hidden; }
.progress-fill { display: block; height: 100%; width: 0; max-width: 100%; background: var(--blue); border-radius: inherit; }
.callout { padding: 14px 15px; background: var(--pale); border: 1px solid #d4e1fa; border-radius: 10px; color: #334e78; font-size: 13px; line-height: 1.5; }
.callout strong { color: var(--navy); }
.task-line { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 13px 0; border-bottom: 1px solid #edf0f4; }
.task-line:last-child { border-bottom: 0; }
.task-line p { margin-top: 5px; color: var(--muted); font-size: 12px; }
.task-line .owner { flex-shrink: 0; }

.button { min-height: 37px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: white; color: var(--ink); text-decoration: none; white-space: nowrap; font-size: 13px; font-weight: 500; line-height: 1.2; }
.button:hover { border-color: #b6c4d8; background: #f9fbff; }
.button.primary { border-color: var(--blue); background: var(--blue); color: white; }
.button.primary:hover { background: #064cce; border-color: #064cce; }
.button.ghost { border-color: transparent; background: transparent; color: var(--blue); }
.button.ghost:hover { background: var(--pale); }
.button.ghost.selected { border-color: #c5d7f7; background: var(--pale); color: var(--blue); }
.icon-button { min-width: 37px; min-height: 37px; display: inline-flex; align-items: center; justify-content: center; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: white; color: var(--muted); }
.icon-button:hover { background: #f6f8fc; color: var(--navy); }
.search-input, select, .field input, .field textarea { min-height: 37px; max-width: 100%; padding: 8px 11px; color: var(--ink); background: white; border: 1px solid #d8e0ea; border-radius: 8px; font-size: 13px; line-height: 1.35; }
.search-input::placeholder, .field input::placeholder, .field textarea::placeholder { color: #8994a4; }
.search-input { width: 210px; }
select { padding-right: 28px; }
.notice { padding: 12px 14px; border: 1px solid #d6e1f5; border-radius: 9px; background: #f4f7fd; color: #425c83; font-size: 13px; line-height: 1.5; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; min-height: 210px; padding: 30px 20px; color: var(--muted); text-align: center; border: 1px dashed #cfd8e5; border-radius: var(--radius); background: #fafbfc; }
.empty strong, .empty h3 { color: var(--navy); font-size: 16px; font-weight: 500; }
.empty p { max-width: 340px; font-size: 13px; }
.empty .button { margin-top: 5px; }

.modal-overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; background: #07182f68; backdrop-filter: blur(3px); }
.modal { width: min(620px, 100%); max-height: 88dvh; min-width: 0; overflow-y: auto; padding: 24px; border: 1px solid #d6dfeb; border-radius: 18px; background: white; box-shadow: 0 24px 90px #07182f38; }
.modal > .panel-head { margin: -5px 0 18px; padding: 0 0 15px; }
.modal > h2 { margin-bottom: 18px; }
.modal p { line-height: 1.6; }
.modal p + p { margin-top: 12px; }
.modal .inline-actions { justify-content: flex-end; margin-top: 20px; }
.form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.field { min-width: 0; display: flex; flex-direction: column; gap: 6px; margin-bottom: 13px; color: var(--ink); font-size: 12px; font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; font-weight: 400; }
.field textarea { min-height: 95px; resize: vertical; }
.field small { color: var(--muted); font-weight: 400; font-size: 11px; }
.evidence-steps .stat strong { font-size: 18px; line-height: 1.4; overflow-wrap: anywhere; }
.help-list { margin: 0; padding-left: 23px; }
.help-list li { padding-left: 3px; margin: 11px 0; line-height: 1.6; }
.toast { position: fixed; z-index: 150; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 12px 18px; border: 1px solid #2c4361; border-radius: 10px; background: var(--navy); color: white; font-size: 13px; line-height: 1.5; text-align: center; box-shadow: 0 7px 28px #07182f30; pointer-events: none; }

@media (min-width: 1600px) {
  .page { padding: 28px 32px; }
  .topbar { padding-inline: 32px; }
  .workspace { grid-template-columns: minmax(0, 1fr) 290px; gap: 22px; }
  .data-table { font-size: 14px; }
  .data-table td { height: 62px; }
  .table-title { font-size: 14px; }
  .cell-sub { font-size: 12px; }
  .action-item h3 { font-size: 15px; }
  .class-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}

@media (min-width: 1151px) and (max-width: 1249px) {
  .class-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

@media (max-width: 1150px) {
  .workspace, .detail-layout { grid-template-columns: minmax(0, 1fr); }
  .aside-stack { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .metrics { gap: 10px; }
  .metric { padding: 15px 13px; }
  .metric-value { font-size: 28px; }
  .class-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (max-width: 760px) {
  .app-shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: relative; height: auto; padding: 14px 16px 0; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { width: 137px; margin: 0 0 12px; }
  .school-label, .sidebar-foot { display: none; }
  .sidebar-focus { display: none; }
  .sidebar nav, .sidebar .nav-list { display: flex; flex-direction: row; gap: 5px; overflow-x: auto; max-width: 100%; padding-bottom: 10px; }
  .nav-item { width: auto; min-height: 36px; flex-shrink: 0; gap: 7px; padding: 8px 10px; font-size: 12px; white-space: nowrap; }
  .nav-item svg { width: 15px; height: 15px; }
  .topbar { min-height: 57px; padding: 10px 16px; gap: 10px; flex-wrap: wrap; }
  .topbar .button { min-height: 34px; font-size: 12px; }
  .topbar .crumb { font-size: 11px; }
  .page { padding: 19px 16px 24px; }
  .page-head { gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 24px; }
  .page-head p, .page-head .sub { font-size: 12px; }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-bottom: 16px; }
  .metric { min-height: 99px; padding: 13px; border-radius: 11px; }
  .metric-value { font-size: 28px; }
  .metric-label { font-size: 11px; }
  .metric-sub { font-size: 11px; }
  .workspace, .detail-layout { gap: 15px; }
  .panel { border-radius: 12px; }
  .panel-head { padding: 13px; gap: 10px; }
  .panel-head h2, .panel-head h3 { font-size: 14px; }
  .filters { padding: 10px 12px; gap: 7px; }
  .filters > .search-input { flex-basis: 150px; max-width: none; }
  .filters .field, .filters .field:first-child { flex: 1 1 calc(50% - 4px); min-width: 0; max-width: none; align-self: flex-start; }
  .filters select { flex: none; width: 100%; height: 37px; min-height: 37px; max-width: 100%; }
  .data-table { min-width: 700px; }
  .pager { padding: 10px 12px; gap: 8px; font-size: 11px; }
  .pager .button, .pager .icon-button { min-width: 31px; min-height: 34px; padding-inline: 8px; }
  .aside-stack { grid-template-columns: minmax(0, 1fr); }
  .class-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .class-card { min-height: 110px; padding: 13px; gap: 8px; }
  .class-card h3 { font-size: 13px; }
  .class-card .tag { font-size: 11px; white-space: normal; }
  .split { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .detail-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat { padding: 13px; }
  .stat strong, .stat .metric-value { font-size: 23px; }
  .tabs { gap: 0; }
  .tabs button { font-size: 12px; padding-inline: 10px; }
  .task-line { gap: 9px; }
  .task-line .owner { max-width: 90px; text-align: right; font-size: 11px; }
  .decision-line { flex-direction: column; gap: 14px; }
  .decision-line-end { align-items: flex-start; width: 100%; }
  .decision-line-end .inline-actions { width: 100%; }
  .decision-line-end .button.primary { margin-left: auto; }
  .decision-line > .inline-actions { flex-wrap: wrap; }
  .decision-line > .inline-actions > div { flex: 1 1 170px; }
  .modal-overlay { padding: 14px; }
  .modal { padding: 20px; border-radius: 14px; max-height: 92dvh; }
  .form-row { grid-template-columns: minmax(0, 1fr); gap: 0; }
}

@media (max-width: 390px) {
  .page { padding-inline: 12px; }
  .topbar { padding-inline: 12px; }
  .class-grid { gap: 8px; }
  .class-card { padding: 11px; }
  .class-card .class-head { align-items: flex-start; gap: 7px; }
  .class-card .class-head > .small { font-size: 11px; }
  .class-card .class-chip { min-width: 39px; font-size: 12px; }
  .bar-row { grid-template-columns: 70px minmax(0, 1fr) 45px; gap: 7px; font-size: 11px; }
  .pager { flex-wrap: wrap; }
}

@media (prefers-reduced-motion: no-preference) {
  .nav-item, .button, .icon-button, .metric, .class-card { transition: background .14s ease, border-color .14s ease, box-shadow .14s ease; }
  .progress-fill { transition: width .2s ease; }
}

@media print {
  .app-shell { display: block; }
  .sidebar, .topbar, .filters, .pager, .modal-overlay, .icon-button, .button { display: none !important; }
  .page { max-width: none; padding: 0; }
  .workspace, .detail-layout { display: block; }
  .aside-stack { margin-top: 18px; }
  .panel, .metric, .class-card { break-inside: avoid; box-shadow: none; }
  .table-wrap { overflow: visible; }
  .data-table { min-width: 0; font-size: 11px; }
  .data-table td { height: auto; }
  .tag, .class-chip, .progress-fill { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

.mobile-demo{display:none}
@media(max-width:760px){.sidebar .mobile-demo{display:block;position:absolute;top:22px;right:16px;font-size:11px;color:var(--muted);white-space:nowrap}}
</style></head>

function filterControls(status=true){const subjects=[...new Set(model.records.map(r=>r.subject))].sort((a,b)=>a.localeCompare(b,'uk'));return `<div class="filters"><label class="field"><span class="small muted">Клас або результат</span><input class="search-input" id="searchField" data-filter="q" placeholder="Наприклад, 7-А" value="${esc(state.q)}"></label><label class="field"><span class="small muted">Паралель</span><select data-filter="grade"><option value="all">Усі класи</option>${Array.from({length:11},(_,i)=>`<option value="${i+1}" ${state.grade==i+1?'selected':''}>${i+1} класи</option>`).join('')}</select></label><label class="field"><span class="small muted">Предмет</span><select data-filter="subject"><option value="all">Усі предмети</option>${subjects.map(s=>`<option ${state.subject===s?'selected':''}>${esc(s)}</option>`).join('')}</select></label>${status?`<label class="field"><span class="small muted">Стан роботи</span><select data-filter="status">${[['attention','Відкриті питання'],['all','Усі результати'],['review','Потрібне рішення'],['supporting','Підтримка триває'],['returning','Повернення до 4.11'],['no_data','Немає даних'],['normal','У роботі вчителя']].map(([v,l])=>`<option value="${v}" ${state.status===v?'selected':''}>${l}</option>`).join('')}</select></label>`:''}<button class="button ghost small" data-reset-filters>Скинути</button></div>`}
function kpis(){const m=metrics(scoped());return `<div class="metrics">${[
 ['review','До спільного розгляду',m.review,'потрібне рішення керівника'],
 ['supporting','Підтримка триває',m.support,'погоджені цикли роботи'],
 ['returning','Повернення до 4 листопада',m.returning,'заплановані контрольні точки'],
 ['no_data','Класи зі свідченнями',m.withData+'<span class="muted small"> / '+m.classTotal+'</span>',(m.classTotal-m.withData)+' класів без свідчень за жовтень']
 ].map(([f,l,v,s])=>`<button class="metric ${state.status===f?'selected':''}" data-kpi="${f}"><span class="metric-label">${l}</span><strong class="metric-value">${v}</strong><span class="metric-sub">${s}<span aria-hidden="true"> ↗</span></span></button>`).join('')}</div>`}
function resultTable(list,paginate=true){const max=Math.max(1,Math.ceil(list.length/PAGE_SIZE));state.page=Math.min(state.page,max);const rows=paginate?list.slice((state.page-1)*PAGE_SIZE,state.page*PAGE_SIZE):list;return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Клас і навчальний результат</th><th>Перевірено</th><th>Виконали</th><th>Потребують уваги</th><th>Стан роботи</th><th>Повернення</th></tr></thead><tbody>${rows.map(r=>{const c=cls(r.classId);return `<tr data-row="${esc(r.id)}"><td><div class="result-cell"><button class="class-chip" data-class="${esc(c.id)}">${c.id}</button><div><button class="bread-button table-title" aria-label="${esc(r.skill)}" title="${esc(r.skill)}" data-open="${esc(r.id)}">${esc(displaySkill(r))}</button><span class="cell-sub">${esc(r.subject)} · ${r.date?ndate(r.date):'свідчень ще немає'}</span></div></div></td><td>${hasData(r)?nums(r.assessed,c.size):r.evidenceType==='observation'?'<span class="small muted">Спостереження</span>':'<span class="muted">—</span>'}<div class="progress-track" aria-label="Охоплення перевіркою: ${r.assessed??'даних немає'} з ${c.size}"><div class="progress-fill" style="width:${hasData(r)?r.assessed/c.size*100:0}%"></div></div></td><td>${hasData(r)?nums(r.met,r.assessed):'<span class="muted">—</span>'}</td><td>${hasData(r)?`<span class="need-value">${r.need}</span><span class="muted small"> із ${r.assessed}</span>`:'<span class="muted small">'+(r.evidenceType==='observation'?'Якісні свідчення':'Не визначено')+'</span>'}</td><td>${tag(r)}</td><td><button class="bread-button date" data-open="${esc(r.id)}">${ndate(r.nextDate)}<span aria-hidden="true"> ↗</span></button></td></tr>`}).join('')||'<tr><td colspan="6"><div class="empty">За цими умовами результатів немає.<br><button class="bread-button" data-reset-filters>Скинути фільтри</button></div></td></tr>'}</tbody></table></div>${paginate?`<div class="pager"><span class="small muted">${list.length?((state.page-1)*PAGE_SIZE+1)+'–'+Math.min(state.page*PAGE_SIZE,list.length):0} із ${list.length} результатів</span><div class="inline-actions"><button class="button ghost small" data-page="-1" ${state.page===1?'disabled':''}>← Назад</button><span class="small muted">${state.page} / ${max}</span><button class="button ghost small" data-page="1" ${state.page===max?'disabled':''}>Далі →</button></div></div>`:''}`}
function queue(){const list=scoped().filter(r=>r.state==='review'||overdue(r)).sort((a,b)=>(a.decisionDue||'9999').localeCompare(b.decisionDue||'9999'));return `<div class="aside-stack"><section class="panel"><div class="panel-head"><h2>Потребує рішення</h2><span class="count-badge">${list.length}</span></div><div class="action-list">${list.slice(0,3).map(r=>`<article class="action-item"><div class="inline-actions"><span class="class-chip static">${r.classId}</span><span class="small ${overdue(r)?'overdue':'muted'}">${overdue(r)?'Прострочено · ':''}${ndate(r.decisionDue)}</span></div><h3>${esc(r.directorAction)}</h3><div class="owner">${esc(r.decisionOwner||'Директор')}</div><button class="bread-button" data-open="${r.id}">Відкрити ситуацію ↗</button></article>`).join('')||'<div class="empty small">Відкритих рішень у цьому виборі немає.</div>'}</div><button class="button ghost" data-view="actions">Усі рішення →</button></section><section class="panel"><div class="panel-head"><h2>Найближче повернення</h2></div>${scoped().filter(r=>r.nextDate>=ASOF).sort((a,b)=>a.nextDate.localeCompare(b.nextDate)).slice(0,2).map(r=>`<div class="task-line"><span class="date">${ndate(r.nextDate)}</span><button class="bread-button" data-open="${r.id}"><strong>${r.classId}</strong> · ${esc(r.subject)}</button></div>`).join('')||'<p class="small muted">Немає запланованих дат.</p>'}</section></div>`}
function overview(){return `<div class="page-head"><div><h1>Огляд школи</h1><p class="muted">${model.classes.length} класів · ${model.classes.reduce((s,c)=>s+c.size,0)} учнів · обрані результати за жовтень</p></div><button class="button" data-view="classes">Усі класи →</button></div>${filterControls()}${kpis()}<div class="workspace"><section class="panel"><div class="panel-head"><h2>Навчальні результати</h2><span class="small muted">Критерій визначено для кожного результату</span></div>${resultTable(filtered())}</section>${queue()}</div>`}
function classesView(){const classes=model.classes.filter(c=>(state.grade==='all'||c.grade===+state.grade)&&(!state.q||norm(c.id).includes(norm(state.q))));return `<div class="page-head"><div><h1>Класи</h1><p class="muted">Уся школа · ${model.classes.length} класів · ${model.classes.reduce((n,c)=>n+c.size,0)} учнів</p></div></div><div class="filters"><label class="field"><span class="small muted">Знайти клас</span><input class="search-input" id="searchField" data-filter="q" placeholder="Наприклад, 7-А" value="${esc(state.q)}"></label><label class="field"><span class="small muted">Паралель</span><select data-filter="grade"><option value="all">Усі паралелі</option>${Array.from({length:11},(_,i)=>`<option value="${i+1}" ${state.grade==i+1?'selected':''}>${i+1} класи</option>`).join('')}</select></label><button class="button ghost" data-reset-filters>Скинути</button></div><div class="class-grid">${classes.map(c=>{const rs=model.records.filter(r=>r.classId===c.id),data=rs.filter(hasEvidence),open=rs.filter(r=>r.state!=='normal'),next=rs.map(r=>r.nextDate).filter(Boolean).sort()[0];return `<button class="class-card" data-class="${c.id}"><div class="class-head"><strong>${c.id}</strong><span class="small muted">${c.size} учнів</span></div><p class="small">${data.length?'Джерел свідчень: '+data.length:'Немає жовтневих свідчень'}</p><div class="inline-actions"><span class="tag ${!data.length?'no_data':open.length?'support':'normal'}">${!data.length?'Оновити дані':open.length?'У роботі: '+open.length:'Без спільного розгляду'}</span><span class="small muted">${next?ndate(next):'—'}</span></div></button>`}).join('')||'<div class="empty">Класів за цими умовами немає.</div>'}</div>`}
function classView(){const c=cls(state.classId),rs=model.records.filter(r=>r.classId===c.id);return `<div class="page-head"><div><h1>${c.id} клас</h1><p class="muted">${c.size} учнів · ${rs.length} обраних навчальних результатів</p></div><button class="button" data-back>← Назад</button></div><section class="panel"><div class="panel-head"><h2>Останні навчальні свідчення</h2><span class="small muted">Поточний стан за кожною перевіркою</span></div>${resultTable(rs,false)}</section><p class="note">Рядок описує конкретний навчальний результат, а не загальну успішність класу.</p>`}
function bars(r,cohort='paired'){let list=r.paired||[],title='Ті самі учні';if(r.id==='fractions-7a'&&cohort==='target'){list=[{date:'2026-10-07',met:0,total:8},{date:'2026-10-13',met:3,total:8},{date:'2026-10-21',met:6,total:8}];title='Початкова вісімка'}if(list.length<2)return '<div class="empty small">Повторної перевірки ще немає.<br>Динаміку покажемо після повернення до результату.</div>';return `<p class="small muted chart-caption">Виконали критерій · ${title}</p><div class="mini-bars">${list.map((p,i)=>`<div class="bar-row"><div class="small">${i===0?'До':i===list.length-1?'Після':'Під час'}<span class="cell-sub">${ndate(p.date)}</span></div><div class="progress-track"><div class="progress-fill" style="width:${p.met/p.total*100}%"></div></div><strong>${p.met}<span class="muted small"> / ${p.total}</span></strong></div>`).join('')}</div><p class="small muted">${r.id==='fractions-7a'?(cohort==='target'?'U01–U08 на всіх трьох перевірках.':'U09 має окремий старт; у це порівняння не входить.'):'Однакова когорта й критерій у межах цього умовного прикладу.'}</p>`}
function caseView(){const r=rec(state.recordId),c=cls(r.classId);return `<div class="page-head"><div><div class="inline-actions"><button class="class-chip" data-class="${r.classId}">${r.classId}</button><span class="muted small">${esc(r.subject)}</span>${tag(r)}</div><h1>${esc(displaySkill(r))}</h1><p class="muted">${r.date?'Останні свідчення: '+ndate(r.date):'Спершу потрібно отримати достатні свідчення'} · ${esc(r.owner)}</p></div><button class="button" data-back>← Назад</button></div><div class="detail-stats"><div class="stat"><span class="muted small">Перевірено учнів</span><strong>${hasData(r)?nums(r.assessed,c.size):'—'}</strong></div><div class="stat"><span class="muted small">Виконали критерій</span><strong>${hasData(r)?nums(r.met,r.assessed):'—'}</strong></div><div class="stat"><span class="muted small">Потребують уваги</span><strong>${hasData(r)?nums(r.need,r.assessed):'Не визначено'}</strong></div><div class="stat"><span class="muted small">Немає роботи</span><strong>${hasData(r)?c.size-r.assessed:'—'}</strong></div></div><div class="tabs" role="tablist" aria-label="Розділи ситуації">${[['summary','Результат'],['action','Дія та умови'],['history','Історія']].map(([v,l])=>`<button role="tab" aria-selected="${state.detailTab===v}" data-tab="${v}" class="${state.detailTab===v?'active':''}">${l}</button>`).join('')}</div>${state.detailTab==='summary'?caseSummary(r):state.detailTab==='action'?caseAction(r):caseHistory(r)}`}
function caseSummary(r){return `<div class="detail-layout"><section class="panel"><div class="panel-head"><h2>Що змінилося</h2>${r.id==='fractions-7a'?`<div class="inline-actions"><button class="button ghost small ${state.cohort!=='target'?'selected':''}" data-cohort="paired">Ті самі 27</button><button class="button ghost small ${state.cohort==='target'?'selected':''}" data-cohort="target">Початкова вісімка</button></div>`:''}</div>${bars(r,state.cohort)}<div class="divider"></div><h3>Що перевіряємо</h3><p class="note">${esc(r.criterion)}</p><button class="bread-button" data-evidence="${r.id}">Підстави рішення та роботи ↗</button></section><aside class="aside-stack"><section class="panel"><div class="panel-head"><h2>Наступний крок</h2><span class="date">${ndate(r.nextDate)}</span></div><p>${r.id==='fractions-7a'?'Продовжити підтримку двох учнів. Уточнити один новий сигнал.':esc(r.teacherAction)}</p><p class="owner">${esc(r.owner)}</p><button class="button primary" data-tab="action">Відкрити дію →</button></section>${r.id==='fractions-7a'?'<section class="panel"><h3>Три питання в роботі</h3><div class="task-line"><strong>U03</strong><span>Визначення цілого</span></div><div class="task-line"><strong>U08</strong><span>Кількість частин</span></div><div class="task-line"><strong>U28</strong><span>Новий сигнал</span></div></section>':''}<section class="panel"><p class="small muted">${hasData(r)?(cls(r.classId).size-r.assessed)+' учнів без роботи на цій перевірці.':hasEvidence(r)?'Є якісні спостереження. Числової перевірки не проводили.':'Відсутність даних не є невиконанням критерію.'}</p></section></aside></div>`}
function caseAction(r){return `<div class="detail-layout"><section class="panel"><div class="panel-head"><h2>${r.state==='review'?'Пропонована робота':'Дія та умови'}</h2>${tag(r)}</div><div class="task-line"><span class="class-chip static">Учитель</span><div><h3>Що змінюється в навчанні</h3><p class="note">${esc(r.teacherAction)}</p><span class="owner">${esc(r.owner)}</span></div></div><div class="task-line"><span class="class-chip static">Директор</span><div><h3>Які умови потрібні</h3><p class="note">${esc(r.directorAction)}</p><span class="owner">${esc(r.decisionOwner||'Директор')}</span></div></div><div class="task-line"><span class="class-chip static">Повернення</span><div><h3>${ndate(r.nextDate)}</h3><p class="note">Нові доречні завдання за тим самим результатом; уточнення подальшої підтримки.</p></div></div></section><aside class="aside-stack"><section class="panel"><div class="panel-head"><h2>${r.state==='review'?'Потрібне рішення':'Домовленість'}</h2></div><p>${esc(r.directorAction)}</p><p class="note">${r.decisionDue?'Погодити до '+ndate(r.decisionDue):'Повернутися '+ndate(r.nextDate)}</p>${overdue(r)?'<span class="tag review overdue">Строк погодження минув</span>':''}<button class="button primary" data-agree="${r.id}">${r.state==='review'?'Погодити дію':'Змінити домовленість'}</button><p class="small muted">Зміна діє лише в цьому сеансі прототипу.</p></section></aside></div>`}
function caseHistory(r){if(r.id==='fractions-7a')return `<section class="panel"><div class="panel-head"><h2>Від початкового сигналу до поточного стану</h2></div><div class="timeline">${[['07.10','Початковий сигнал','19 із 27 виконали критерій; 8 потребували уточнення. Однієї роботи немає.'],['08.10','Пояснення перевірено','Дві тимчасові групи по 4 учні: ціле й рівні частини; кількість частин.'],['09–12.10','Адресна підтримка','Учителька змінює вправи; директор організовує спільний аналіз і прибирає дубльований звіт.'],['13.10','Проміжна перевірка','3 із початкових 8 виконали критерій. Увесь клас у цій точці не перевірявся.'],['21.10','Повторна перевірка','Клас: 25 із 28. Початкова вісімка: 6 із 8. U09 з пізнім стартом виконав критерій; U28 — новий сигнал.'],[ndate(r.nextDate),'Наступне повернення','Заплановано перевірку збереження й перенесення; результату ще немає.']].map(([d,t,p])=>`<article class="task-line"><span class="date">${d}</span><div><h3>${t}</h3><p class="note">${p}</p></div></article>`).join('')}</div></section>`;return `<section class="panel"><h2>Історія перевірок</h2>${(r.paired||[]).length?`<div class="timeline">${r.paired.map(p=>`<div class="task-line"><span class="date">${ndate(p.date)}</span><span>${p.met} із ${p.total} виконали критерій</span></div>`).join('')}</div>`:'<p class="note">Попередніх співвідносних перевірок у прикладі немає.</p>'}<div class="task-line"><span class="date">${ndate(r.nextDate)}</span><span>${r.nextDate?'Наступне повернення заплановано.':'Дату повернення не визначено.'}</span></div></section>`}
function actionsView(){const rows=scoped().filter(r=>(state.actionsMode==='all'&&['review','agreed','support','recheck'].includes(r.state))||r.state==='review'||overdue(r)).sort((a,b)=>(a.decisionDue||'9999').localeCompare(b.decisionDue||'9999'));return `<div class="page-head"><div><h1>Рішення директора</h1><p class="muted">Організаційні умови, відповідальні та строки</p></div><div class="tabs"><button data-action-mode="open" class="${state.actionsMode==='open'?'active':''}">Потребують погодження</button><button data-action-mode="all" class="${state.actionsMode==='all'?'active':''}">Усі домовленості</button></div></div>${filterControls(false)}<section class="panel"><div class="action-list">${rows.map(r=>`<article class="decision-line"><div><div class="inline-actions"><button class="class-chip" data-class="${r.classId}">${r.classId}</button><span class="small muted">${esc(r.subject)}</span>${tag(r)}</div><h3>${esc(r.directorAction)}</h3><p class="note">${esc(r.skill)} · ${esc(r.decisionOwner||'Директор')}</p></div><div class="decision-line-end"><span class="date ${overdue(r)?'overdue':''}">${r.decisionDue?(overdue(r)?'Прострочено · ':'До ')+ndate(r.decisionDue):'Повернення '+ndate(r.nextDate)}</span><div class="inline-actions"><button class="button ghost" data-open="${r.id}">Ситуація ↗</button><button class="button primary" data-agree="${r.id}">${r.state==='review'?'Погодити':'Змінити'}</button></div></div></article>`).join('')||'<div class="empty">Непогоджених рішень у цьому виборі немає.</div>'}</div></section>`}
function checksView(){const list=scoped().filter(r=>state.checksMode==='all'||(r.nextDate&&r.nextDate>=ASOF&&r.nextDate<=END)).sort((a,b)=>(a.nextDate||'9999').localeCompare(b.nextDate||'9999'));return `<div class="page-head"><div><h1>Повернення до результату</h1><p class="muted">План перевірок і розмов із педагогами</p></div><div class="tabs"><button data-check-mode="upcoming" class="${state.checksMode==='upcoming'?'active':''}">До 4 листопада</button><button data-check-mode="all" class="${state.checksMode==='all'?'active':''}">Усі дати</button></div></div>${filterControls(false)}<section class="panel"><div class="action-list">${list.map(r=>`<article class="decision-line"><div class="inline-actions"><span class="date">${ndate(r.nextDate)}</span><button class="class-chip" data-class="${r.classId}">${r.classId}</button><div><button class="bread-button table-title" data-open="${r.id}">${esc(displaySkill(r))}</button><span class="cell-sub">${esc(r.subject)} · ${esc(r.owner)}</span></div></div><span class="tag ${r.state}">${r.nextDate?'Заплановано':'Дату не погоджено'}</span></article>`).join('')||'<div class="empty">У вибраний період повернень немає.</div>'}</div></section>`}
function pageRender(){return state.view==='overview'?overview():state.view==='classes'?classesView():state.view==='class'?classView():state.view==='case'?caseView():state.view==='actions'?actionsView():checksView()}
function render(){const focus=document.activeElement?.id,position=focus==='searchField'?document.activeElement.selectionStart:null;$('pageContent').innerHTML=pageRender();root.querySelectorAll('[data-view].nav-item').forEach(b=>{const active=b.dataset.view===state.view||(b.dataset.view==='classes'&&['class','case'].includes(state.view));b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('breadcrumbs').innerHTML=['case','class'].includes(state.view)?`<button class="bread-button" data-view="overview">Школа</button><span> / </span><button class="bread-button" data-class="${esc(state.classId)}">${esc(state.classId)}</button>${state.view==='case'?'<span> / '+esc(rec(state.recordId).subject)+'</span>':''}`:'Навчальні результати / '+({overview:'Огляд школи',classes:'Класи',actions:'Рішення',checks:'Перевірки'}[state.view]||'');$('decisionNavCount').textContent=metrics().review;$('classNavCount').textContent=model.classes.length;const secondary=model.records.find(r=>r.classId==='8-Б'&&r.state!=='normal')||model.records.find(r=>r.id!=='fractions-7a');$('secondFocus').textContent=secondary.classId+' · '+secondary.subject;$('secondFocus').dataset.open=secondary.id;if(focus==='searchField'&&$('searchField')){$('searchField').focus();$('searchField').setSelectionRange(position,position)} }
function navigate(view){state.history=[];state.view=view;state.page=1;state.recordId=null;state.classId=null;render();window.scrollTo(0,0)}
function pushRoute(){state.history=state.history||[];state.history.push({view:state.view,recordId:state.recordId,classId:state.classId,detailTab:state.detailTab,page:state.page})}
function openRecord(id){const r=rec(id);if(!r)return;pushRoute();if(!['case','class'].includes(state.view))state.returnView=state.view;state.view='case';state.recordId=id;state.classId=r.classId;state.detailTab='summary';state.cohort='paired';render();window.scrollTo(0,0)}
function openClass(id){if(!cls(id))return;pushRoute();if(!['class','case'].includes(state.view))state.returnView=state.view;state.view='class';state.classId=id;render();window.scrollTo(0,0)}
function showModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalOverlay').classList.remove('hidden');$('modalClose').focus();document.body.style.overflow='hidden'}
function closeModal(){$('modalOverlay').classList.add('hidden');document.body.style.overflow=''}
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}
function evidence(r){if(r.id!=='fractions-7a'){showModal('Підстави рішення',`<p class="note">${esc(r.criterion)}</p><div class="task-line"><strong>Свідчення</strong><span>${hasData(r)?r.assessed+' перевірених робіт; '+r.met+' виконали критерій.':hasEvidence(r)?'Є якісні спостереження; числової перевірки немає.':'Навчальних свідчень ще недостатньо.'}</span></div><div class="task-line"><strong>Наступна дія</strong><span>${esc(r.teacherAction)}</span></div><p class="small muted">Пояснення потреби уточнює вчитель за роботами й розмовою. Дані цього прототипу умовні.</p>`);return}const score=window.CASE7A_SCORES||[],get=(id,st)=>score.find(x=>x[0]===id&&x[2]===st);showModal('7-А · Педагогічні підстави',`<p class="callout">¾ від 20 = 15. Відповідь «5» — підстава уточнити міркування учня.</p><div class="detail-stats evidence-steps">${[['Ціле','20'],['Одна частина','20 : 4 = 5'],['Кількість частин','3'],['Величина й перевірка','5 × 3 = 15']].map(([t,v])=>`<div class="stat"><span class="small muted">${t}</span><strong>${v}</strong></div>`).join('')}</div><p class="note">Учителька перевірила пояснення за роботами та розмовою. Дві тимчасові групи по 4 учні: ціле й рівні частини; кількість частин. Директор забезпечив час спільного аналізу.</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Учень · T2</th><th>Ціле</th><th>Одна частина</th><th>Кількість</th><th>Величина</th><th>Самостійно</th></tr></thead><tbody>${['U03','U08','U28'].map(id=>`<tr><td>${id}</td>${get(id,'T2').slice(3).map(v=>`<td>${v} / 3</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted">На 21 жовтня: U03/U08 продовжують підтримку, U28 — новий сигнал. Критерій прикладу: кожен крок і самостійні задачі щонайменше 2 із 3; це авторська робоча межа.</p>`)}
function agreeForm(r){showModal('Погодити організаційну дію',`<form id="agreeForm" data-record="${r.id}"><p class="note">${r.classId} · ${esc(r.subject)} · ${esc(r.skill)}</p><label class="field">Що забезпечуємо<textarea name="action" required rows="3">${esc(r.directorAction)}</textarea></label><div class="form-row"><label class="field">Відповідальний за умови<select name="owner">${['Директор','Заступник директора','Керівник професійної спільноти'].map(o=>`<option ${o===(r.decisionOwner||'Директор')?'selected':''}>${o}</option>`).join('')}</select></label><label class="field">Дата повернення<input name="date" type="date" min="${ASOF}" value="${r.nextDate&&r.nextDate>=ASOF?r.nextDate:'2026-11-04'}" required></label></div><p class="small muted">Педагогічну дію веде ${esc(r.owner.toLowerCase())}. Зміни зберігаються лише в поточному сеансі прототипу.</p><div class="inline-actions"><button class="button primary" type="submit">Погодити дію</button><button class="button ghost" type="button" data-close>Скасувати</button></div></form>`)}
function approve(id,values){const r=rec(id);if(!r)throw Error('Немає ситуації');if(!values.action.trim()||!values.date||values.date<ASOF)throw Error('Потрібна дія й коректна майбутня дата');r.directorAction=values.action.trim();r.decisionOwner=values.owner;r.nextDate=values.date;r.decisionDue=null;if(r.state==='review')r.state='agreed';return r}
function help(){showModal('Маршрут демонстрації · 5 хвилин',`<ol class="help-list"><li><strong>Огляд школи.</strong> Покажіть кілька класів і поясніть чотири показники. Потреба в підтримці — у рядку конкретного результату.</li><li><strong>7-А · Математика.</strong> Відкрийте з «У роботі». Поточний стан: 25 із 28; у роботі три питання.</li><li><strong>Історія й дія.</strong> Перейдіть в «Історія», потім «Дія та умови». Початкові 8 із 27 — історичний сигнал.</li><li><strong>Інший клас.</strong> Відкрийте 8-Б або знайдіть 5-А у «Класах». Покажіть інший предмет і результат.</li><li><strong>Рішення.</strong> Відкрийте прострочену дію; погодьте умови й дату. Поверніться до огляду — показники зміняться.</li></ol><div class="divider"></div><p class="small muted">Усі записи, критерії та обставини умовні. Прототип показує логіку інтерфейсу; він не підключений до журналу. F — повний екран, Esc — закрити пояснення.</p><button class="button ghost" data-reset-demo>Скинути зміни демо</button>`)}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-open'))openRecord(b.dataset.open);else if(b.hasAttribute('data-class'))openClass(b.dataset.class);else if(b.hasAttribute('data-view'))navigate(b.dataset.view);else if(b.hasAttribute('data-tab')){state.detailTab=b.dataset.tab;render()}else if(b.hasAttribute('data-kpi')){state.status=state.status===b.dataset.kpi?'attention':b.dataset.kpi;state.page=1;render()}else if(b.hasAttribute('data-page')){state.page+=+b.dataset.page;render()}else if(b.hasAttribute('data-back')){const prior=(state.history||[]).pop();if(prior)Object.assign(state,prior);else state.view='overview';render()}else if(b.hasAttribute('data-reset-filters')){Object.assign(state,{grade:'all',subject:'all',status:'attention',q:'',page:1});render()}else if(b.hasAttribute('data-cohort')){state.cohort=b.dataset.cohort;render()}else if(b.hasAttribute('data-evidence'))evidence(rec(b.dataset.evidence));else if(b.hasAttribute('data-agree'))agreeForm(rec(b.dataset.agree));else if(b.hasAttribute('data-close'))closeModal();else if(b.hasAttribute('data-help'))help();else if(b.hasAttribute('data-check-mode')){state.checksMode=b.dataset.checkMode;render()}else if(b.hasAttribute('data-action-mode')){state.actionsMode=b.dataset.actionMode;render()}else if(b.hasAttribute('data-reset-demo')){reset();closeModal();toast('Демонстрацію повернуто до початкового стану')}});
root.addEventListener('change',e=>{if(e.target.dataset.filter){state[e.target.dataset.filter]=e.target.value;state.page=1;render()}});
root.addEventListener('input',e=>{if(e.target.dataset.filter==='q'){state.q=e.target.value;state.page=1;render()}});
root.addEventListener('submit',e=>{if(e.target.id!=='agreeForm')return;e.preventDefault();const data=new FormData(e.target);try{approve(e.target.dataset.record,{action:data.get('action'),owner:data.get('owner'),date:data.get('date')});closeModal();render();toast('Дію погоджено в прототипі')}catch(err){toast(err.message)}});
$('modalClose').addEventListener('click',closeModal);$('modalOverlay').addEventListener('click',e=>{if(e.target===$('modalOverlay'))closeModal()});
async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('Для повного екрана натисніть F11')}}$('fullBtn').addEventListener('click',full);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.metaKey&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))full()});
function reset(){model=JSON.parse(JSON.stringify(ORIGINAL));state={view:'overview',grade:'all',subject:'all',status:'attention',q:'',page:1,recordId:null,classId:null,detailTab:'summary',returnView:'overview',checksMode:'upcoming',actionsMode:'open',cohort:'paired'};render()}
function validate(){const errors=[];if(model.classes.length!==25)errors.push('25 classes');if(new Set(model.classes.map(c=>c.id)).size!==25)errors.push('class ids');for(const r of model.records){if(!cls(r.classId))errors.push(r.id+' class');if(!ST[r.state])errors.push(r.id+' state');if(hasData(r)){if(r.met>r.assessed||r.assessed>cls(r.classId).size||r.met<0||r.need!==r.assessed-r.met)errors.push(r.id+' counts');if(r.date>ASOF)errors.push(r.id+' future actual')}else if(r.met!==null||r.assessed!==null||r.need!==null)errors.push(r.id+' missing');for(const p of r.paired||[])if(p.met>p.total||p.met<0||p.date>ASOF)errors.push(r.id+' paired')}const r=rec('fractions-7a');if(r.met!==25||r.assessed!==28||r.need!==3)errors.push('7a current');return {passed:errors.length===0,errors,metrics:metrics(),classes:model.classes.length,records:model.records.length}}
const validation=validate();if(!validation.passed)throw Error('Некоректні дані: '+validation.errors.join('; '));mountIcons();render();
window.DIRECTOR_APP={getState:()=>({...state}),getMetrics:()=>metrics(),getCase:id=>JSON.parse(JSON.stringify(rec(id))),getData:()=>JSON.parse(JSON.stringify(model)),filter:filters=>{Object.assign(state,filters,{page:1});render();return filtered().map(r=>r.id)},open:openRecord,openClass,navigate,approve:(id,values)=>{const r=approve(id,values);render();return r},validate,reset};
})();
</script>
</body></html>
